plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'scala'
}

group = mod_group_id

// GitHub tags are the canonical release version.
// Tags use a leading "v" (for example v1.9.2), but the actual
// Gradle/mod/Maven version must not include that prefix.
//
// - GitHub tag v1.9.2      -> 1.9.2
// - Jenkins build 154      -> 1.9.2-dev.154
// - GitHub CI build 154    -> 1.9.2-dev.154
// - Local build            -> 1.9.2-dev.local
def githubTag = System.getenv('GITHUB_REF_TYPE') == 'tag'
    ? System.getenv('GITHUB_REF_NAME')?.replaceFirst(/^v/, '')
    : null

// Non-release builds identify the current development line plus the CI build.
// Jenkins provides BUILD_NUMBER; GitHub Actions provides GITHUB_RUN_NUMBER.
def ciBuildNumber = findProperty('build_number')
    ?: System.getenv('BUILD_NUMBER')
    ?: System.getenv('GITHUB_RUN_NUMBER')
    ?: 'local'

version = githubTag ?: "${mod_version}-dev.${ciBuildNumber}"


base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

configurations {
    // Jars which are bundled/shadowed in the final jar.
    embedded
    compileClasspath.extendsFrom(embedded)
    runtimeClasspath.extendsFrom(embedded)

    // Equivalent of implementation/runtimeOnly, but which are not exposed as
    // public dependencies.
    devImplementation
    devRuntimeOnly
    compileClasspath.extendsFrom(devImplementation)
    runtimeClasspath.extendsFrom(devImplementation, devRuntimeOnly)
}

sourceSets {
    register("data") {
        def main = sourceSets.main
        it.compileClasspath += main.compileClasspath
        it.runtimeClasspath += main.runtimeClasspath
        project.dependencies.add(it.implementationConfigurationName, main.output)
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        register("opencomputers") {
            sourceSet sourceSets.main
        }

        register("opencomputersData") {
            sourceSet sourceSets.main
            sourceSet sourceSets.data
        }

    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            loadedMods = [mods.opencomputers]
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            // Keep client-only mods in the client run's game directory.
            gameDirectory = project.file('run/server')

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            loadedMods = [mods.opencomputersData]
            programArguments.addAll(
                '--mod', project.mod_id,
                '--all',
                '--output', file('src/main/generatedResources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

sourceSets.main.resources {
    srcDir 'src/main/generatedResources'
    exclude '.cache/**'
}

tasks.named('processResources', ProcessResources).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('LICENSES') {
        into 'META-INF/licenses'
    }
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepositories(maven { url = "https://maven.squiddev.cc" })
        filter {
            includeGroup "cc.tweaked"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://api.modrinth.com/maven" })
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://cursemaven.com" })
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://modmaven.dev" })
        filter {
            includeGroup "mezz.jei"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://repo.sleeping.town/" })
        filter {
            includeGroup "dev.emi"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://chickenbones.net/maven/" })
        filter {
            includeGroup "codechicken"
            includeGroup "mrtjp"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://modmaven.dev/" })
        filter {
            includeGroup "appeng"
            includeGroup "mekanism"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://maven.createmod.net" })
        filter {
            includeGroup "net.createmod.ponder"
            includeGroup "com.simibubi.create"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://maven.ryanhcode.dev/releases" })
        filter {
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }
    exclusiveContent {
        forRepositories(maven { url = "https://maven.ithundxr.dev/snapshots" })
        filter {
            includeGroup "com.tterrag.registrate"
        }
    }

    flatDir { dirs 'libs' }
}

dependencies {
    // OpenComputers is predominantly Scala. Bundle the runtime so the mod
    // does not require a separate Scala loader/library mod at runtime.
    // Keep Scala in the parent mod and relocate it into a private namespace.
    // This lets OpenComputers coexist with older Scala mods which still ship
    // ScalableCatsForce and its scala.library module.
    embedded("org.scala-lang:scala-library:2.13.12")

    jarJar(implementation(group: "com.typesafe", name: "config")) {
        version {
            strictly "[1.4.5,)"
            prefer "1.4.5"
        }
    }

    // Every build uses the checksummed GitHub Releases by default. A caller may
    // supply explicit directories to test a candidate artifact before release.
    def runtimeDependenciesDirectory = layout.buildDirectory.dir('runtime-dependencies').get().asFile
    def usePublishedRuntimeDependencies = !findProperty('luaJDirectory') && !findProperty('jnluaNativesDirectory')
    def luaJDirectory = findProperty('luaJDirectory') ?: (usePublishedRuntimeDependencies
        ? new File(runtimeDependenciesDirectory, 'luaj') : null)
    def jnluaNativesDirectory = findProperty('jnluaNativesDirectory') ?: (usePublishedRuntimeDependencies
        ? new File(runtimeDependenciesDirectory, 'jnlua') : null)

    def luaJ = luaJDirectory
        ? files(new File(luaJDirectory, 'OC-LuaJ.jar'))
        : files()
    compileOnly luaJ
    embedded luaJ

    def jnluaNatives = jnluaNativesDirectory
        ? files(new File(jnluaNativesDirectory, 'OC-JNLua-Natives.jar'))
        : files()
    embedded jnluaNatives

    def downloadRuntimeDependencies = tasks.register('downloadRuntimeDependencies') {
        onlyIf { usePublishedRuntimeDependencies }
        // Jenkins refreshes its checkout for each build; local Gradle builds
        // reuse verified downloads until `clean` removes build/.
        outputs.upToDateWhen { System.getenv('JENKINS_URL') == null }
        outputs.files(
            new File(runtimeDependenciesDirectory, 'luaj/OC-LuaJ.jar'),
            new File(runtimeDependenciesDirectory, 'luaj/OC-LuaJ-SHA256SUMS.txt'),
            new File(runtimeDependenciesDirectory, 'jnlua/OC-JNLua-Natives.jar'),
            new File(runtimeDependenciesDirectory, 'jnlua/OC-JNLua-Natives-SHA256SUMS.txt'))
        doLast {
            def download = { String url, File target ->
                target.parentFile.mkdirs()
                new URL(url).withInputStream { input -> target.withOutputStream { output -> output << input } }
            }
            def verify = { File artifact, File checksum ->
                def expected = checksum.text.trim().tokenize().first()
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    for (int read; (read = input.read(buffer)) >= 0;) digest.update(buffer, 0, read)
                }
                def actual = digest.digest().collect { String.format('%02x', it) }.join()
                if (!actual.equalsIgnoreCase(expected)) throw new GradleException("Checksum mismatch for ${artifact.name}")
            }
            def luaJJar = new File(runtimeDependenciesDirectory, 'luaj/OC-LuaJ.jar')
            def luaJChecksum = new File(runtimeDependenciesDirectory, 'luaj/OC-LuaJ-SHA256SUMS.txt')
            def jnluaJar = new File(runtimeDependenciesDirectory, 'jnlua/OC-JNLua-Natives.jar')
            def jnluaChecksum = new File(runtimeDependenciesDirectory, 'jnlua/OC-JNLua-Natives-SHA256SUMS.txt')
            download('https://github.com/PC-Logix/OC-LuaJ/releases/latest/download/OC-LuaJ.jar', luaJJar)
            download('https://github.com/PC-Logix/OC-LuaJ/releases/latest/download/OC-LuaJ-SHA256SUMS.txt', luaJChecksum)
            download('https://github.com/PC-Logix/OC-JNLua/releases/latest/download/OC-JNLua-Natives.jar', jnluaJar)
            download('https://github.com/PC-Logix/OC-JNLua/releases/latest/download/OC-JNLua-Natives-SHA256SUMS.txt', jnluaChecksum)
            verify(luaJJar, luaJChecksum)
            verify(jnluaJar, jnluaChecksum)
        }
    }
    if (usePublishedRuntimeDependencies) {
        // LuaJ is needed on Scala's compile classpath and both JARs are needed
        // for packaging. Do not attach this to `clean`: it destroys build/.
        tasks.matching { it.name in ['compileJava', 'compileScala', 'jarJar'] }.configureEach {
            dependsOn(downloadRuntimeDependencies)
        }
    }

    // Sable Companion is deliberately bundled. It has a safe identity
    // implementation when Sable is absent and is overridden through its
    // service provider when Sable is installed.
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:[${sable_companion_version},)")) {
        version {
            prefer(sable_companion_version)
        }
    }

    // Load Sable in the IDE runs for integration testing, without making it
    // part of the published OpenComputers dependency set.
    devRuntimeOnly("maven.modrinth:sable:${sable_version}")

    // The bundled Aeronautics release contains the Simulated, Aeronautics,
    // and Offroad content needed to assemble and test actual ships in IDE
    // runs. It remains a development-only runtime dependency.
    devRuntimeOnly("maven.modrinth:create-aeronautics:${aeronautics_version}")

    // ModDevGradle 2.x only discovers actual mods from the normal runtime
    // classpath on Minecraft 1.21.1. These are plain Java libraries that OC
    // embeds into its release jar, so they must also be explicitly added to
    // the development run's additional runtime classpath.
    additionalRuntimeClasspath "com.typesafe:config:1.4.5"
    additionalRuntimeClasspath luaJ
    additionalRuntimeClasspath jnluaNatives
    additionalRuntimeClasspath "org.scala-lang:scala-library:2.13.12"

    def jeiSlug = "jei-${minecraft_version}"

    // CC: Tweaked
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}")
    devRuntimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}")

    // Modern Fix
    devRuntimeOnly("maven.modrinth:modernfix:${modernfix_version}")

    // CoFH & Thermal
    // not currently available for 1.21+
//    compileOnly("curse.maven:cofh-core-69162:4801048")
//    compileOnly("curse.maven:thermal-foundation-222880:4788649")

    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    // Create's MovementBehaviour API exposes Registrate's NonNullConsumer in
    // a method signature. Keep it available while compiling the optional OC
    // Create bridge as well as at dev-runtime.
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // AE2
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    runtimeOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")

    // Mekanism
    compileOnly("mekanism:Mekanism:${mekanism_version}")
    runtimeOnly("mekanism:Mekanism:${mekanism_version}")
    runtimeOnly("mekanism:Mekanism:${mekanism_version}:generators")

    // JEI
    compileOnly("mezz.jei:${jeiSlug}-neoforge-api:${jei_version}")
    devRuntimeOnly("mezz.jei:${jeiSlug}-neoforge:${jei_version}")

    // EMI
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    devRuntimeOnly("dev.emi:emi-neoforge:${emi_version}")

    // CodeChicken
    compileOnly("curse.maven:cb-multipart-258426:${cbmultipart_file_id}")
    runtimeOnly("curse.maven:cb-multipart-258426:${cbmultipart_file_id}")
    compileOnly("curse.maven:codechicken-lib-1-8-242818:${ccl_file_id}")
    runtimeOnly("curse.maven:codechicken-lib-1-8-242818:${ccl_file_id}")

    // EnderStorage
    compileOnly("curse.maven:ender-storage-1-8-245174:${enderstorage_file_id}")
    runtimeOnly("curse.maven:ender-storage-1-8-245174:${enderstorage_file_id}")

    // Project: Red
    compileOnly("mrtjp:ProjectRed:${projred_version}:api")
    runtimeOnly("mrtjp:ProjectRed:${projred_version}:core")
    runtimeOnly("mrtjp:ProjectRed:${projred_version}:transmission")

    testImplementation("com.typesafe:config:1.4.5")
    testImplementation("org.scala-lang:scala-library:2.13.12")
    testImplementation("org.scalatest:scalatest_2.13:3.2.18")
    testImplementation("org.scalatestplus:junit-4-13_2.13:3.2.18.0")
    testImplementation("junit:junit:4.13.2")
    testRuntimeOnly("org.apache.maven:maven-artifact:3.8.5")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = project.version
        }
    }

    repositories {
        maven {
            name = "michiyo"
            url = uri("https://maven.michiyo.me/releases/")
            credentials {
                username = findProperty("maven_user")
                password = findProperty("maven_password")
            }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            sable_version_range    : sable_version_range
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/data/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts").configure {
    dependsOn(generateModMetadata)
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    from({
        configurations.embedded.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF', 'META-INF/**'
    }

    // Java's module resolver rejects two modules exporting scala.* packages.
    // Relocate the bundled runtime and all compiled references to it so an
    // older ScalableCatsForce installation can continue serving other mods.
    doLast {
        li.cil.oc.build.RelocateScalaJar.relocate(archiveFile.get().asFile.toPath())
    }

//    finalizedBy 'reobfJar'
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    include 'li/cil/oc/api/**'
    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    classpath += sourceSets.main.compileClasspath
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.forkOptions.jvmArgs = ['-Xss4m']
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components["java"])
            artifact(tasks.named("apiJar"))
        }
    }
}
